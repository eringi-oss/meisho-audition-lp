<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名称非公開 オーディション SNSフィード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap">
<style>
:root{--accent:#05FF05}
body{margin:0;background:#FFFFFF}
</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; color: #0A1A2F; font-family: 'Noto Sans JP', sans-serif">

<div style="height: 120px; flex: 0 0 120px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between">
<img src="images/logo.png" alt="名称非公開" style="height: 84px; width: auto; display: block">
<div style="text-align: right; line-height: 1.3">
<div style="font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.2em; color: #4A5A55">PRODUCED BY</div>
<div style="font-family: 'Montserrat', sans-serif; font-size: 30px; font-weight: 900; letter-spacing: 0.06em">ANCHOR</div>
</div>
</div>

<div style="height: 460px; flex: 0 0 460px; background: #0A1A2F">
<img src="images/sns_feed_stage.jpg" alt="名称非公開のライブステージ" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>

<div style="flex: 0 0 auto; box-sizing: border-box; padding: 36px 80px 34px; display: flex; flex-direction: column; gap: 18px">
<div style="align-self: flex-start; background: #0A1A2F; color: var(--accent); font-size: 22px; font-weight: 700; letter-spacing: 0.08em; padding: 6px 18px; border-radius: 3px">名称非公開 新体制メンバーオーディション</div>
<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 116px; line-height: 0.95; letter-spacing: -0.01em">NEW MEMBER<br><span style="background: linear-gradient(transparent 60%, var(--accent) 60%, var(--accent) 92%, transparent 92%)">AUDITION</span></h1>
<p style="margin: 4px 0 0; font-size: 34px; font-weight: 900; line-height: 1.4">これまでの音楽と表現を、次のステージへ。</p>
</div>

<div style="flex: 1 1 auto; background: #0A1A2F; color: #FFFFFF; box-sizing: border-box; padding: 30px 80px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 20px"><span style="font-size: 22px; font-weight: 700; color: #D5DDE8">応募受付</span><span style="font-family: 'Montserrat', sans-serif; font-size: 50px; font-weight: 900; color: var(--accent); line-height: 1.1">2026.11.01 — 11.23</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 28px; font-size: 20px; color: #D5DDE8"><span>二次審査 <b style="font-family: 'Montserrat', sans-serif; color: #FFFFFF">12.01—12.05</b></span><span>合宿審査 <b style="font-family: 'Montserrat', sans-serif; color: #FFFFFF">12.05—12.23</b></span><span>新体制発表 <b style="font-family: 'Montserrat', sans-serif; color: #FFFFFF">2027.01.24</b></span></div>
<div style="font-size: 22px; font-weight: 900"><span style="font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.2em; color: var(--accent)">JUDGES</span>　タケヤキ翔　廣瀬大介　山之口理香子<span style="font-size: 17px; font-weight: 700; color: #D5DDE8">　ほか</span></div>
<div style="margin-top: auto; margin-left: -80px; margin-right: -80px; background: var(--accent); color: #0A1A2F; padding: 18px 80px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 26px; font-weight: 900">応募はプロフィールのリンクから</span>
<span style="font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900">@MEISHOHIKOKAI</span>
</div>
</div>

</div>
</body>
</html>
