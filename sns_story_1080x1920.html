<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名称非公開 オーディション ストーリーズ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap">
<style>
:root{--accent:#05FF05}
body{margin:0;background:#FFFFFF}
</style>
</head>
<body>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; color: #0A1A2F; font-family: 'Noto Sans JP', sans-serif">

<div style="height: 520px; flex: 0 0 520px; background: #0A1A2F">
<img src="images/sns_story_stage.jpg" alt="名称非公開のライブステージ" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>

<div style="flex: 0 0 auto; box-sizing: border-box; padding: 48px 80px 44px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px">
<div style="background: #0A1A2F; color: var(--accent); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; padding: 6px 18px; border-radius: 3px">名称非公開 新体制メンバーオーディション</div>
<img src="images/logo.png" alt="名称非公開" style="height: 92px; width: auto; display: block">
</div>
<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 128px; line-height: 0.95; letter-spacing: -0.01em">NEW<br>MEMBER<br><span style="background: linear-gradient(transparent 60%, var(--accent) 60%, var(--accent) 92%, transparent 92%)">AUDITION</span></h1>
<p style="margin: 6px 0 0; font-size: 38px; font-weight: 900; line-height: 1.45">これまでの音楽と表現を、<br>次のステージへ。</p>
<div style="font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; color: #4A5A55">PRODUCED BY <span style="color: #0A1A2F; font-weight: 900">ANCHOR</span></div>
</div>

<div style="flex: 1 1 auto; background: #0A1A2F; color: #FFFFFF; box-sizing: border-box; padding: 44px 80px 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 24px; font-weight: 700; color: #D5DDE8">応募受付</div>
<div style="font-family: 'Montserrat', sans-serif; font-size: 66px; font-weight: 900; color: var(--accent); line-height: 1">2026.11.01 — 11.23</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 32px; font-size: 24px; color: #D5DDE8; margin-top: 6px"><span>二次審査 <b style="font-family: 'Montserrat', sans-serif; color: #FFFFFF">12.01—12.05</b></span><span>合宿審査 <b style="font-family: 'Montserrat', sans-serif; color: #FFFFFF">12.05—12.23</b></span><span>新体制発表 <b style="font-family: 'Montserrat', sans-serif; color: #FFFFFF">2027.01.24</b></span></div>
<div style="font-size: 26px; font-weight: 900; margin-top: 6px"><span style="font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.2em; color: var(--accent)">JUDGES</span>　タケヤキ翔　廣瀬大介　山之口理香子<span style="font-size: 20px; font-weight: 700; color: #D5DDE8">　ほか</span></div>
<div style="margin-top: 14px; align-self: center; background: var(--accent); color: #0A1A2F; padding: 18px 44px; border-radius: 999px; font-size: 30px; font-weight: 900">↓ リンクから応募する</div>
</div>

</div>
</body>
</html>
